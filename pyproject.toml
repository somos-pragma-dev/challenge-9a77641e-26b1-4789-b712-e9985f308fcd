[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pragma-normativa-rag"
version = "0.1.0"
description = "Sistema de consulta normativa con modelos generativos y RAG"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "PragmaFintech Team", email = "team@pragmafintech.com"}
]
keywords = ["rag", "llm", "bedrock", "fastapi", "normativa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.1",
    "pydantic==2.9.0",
    "pydantic-settings==2.4.0",
    "langchain==0.2.5",
    "langchain-aws==0.1.6",
    "langchain-community==0.2.5",
    "boto3==1.34.120",
    "botocore==1.34.120",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "aiohttp==3.10.0",
    "tenacity==8.3.0",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.0",
    "black==24.4.2",
    "pre-commit==3.7.1",
]

[project.urls]
Homepage = "https://github.com/pragmafintech/normativa-rag"
Documentation = "https://docs.pragmafintech.com/normativa-rag"
Repository = "https://github.com/pragmafintech/normativa-rag"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "infra*"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "ANN",
    "B",
    "A",
    "C4",
]
ignore = [
    "ANN101",
    "ANN102",
    "ANN401",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ANN", "B011"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]